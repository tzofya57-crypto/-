function todayStr() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

  let lines = [`*${day.heb}*`, ""];
  day.items.forEach((it, i) => {
    const letter = "אבגדהוזחטי"[i] || (i+1);
    lines.push(`${letter}. ${it.text}`);
    lines.push(`(${it.source})`);
    lines.push("");
  });
  lines.push("*לעילוי נשמת סרן ליאל חיו הי״ד*");
  return lines.join("\n").trim();
}

async function copyText(text, msgEl) {
  try {
    await navigator.clipboard.writeText(text);
  } catch (e) {
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    } catch (e2) {
      if (msgEl) { msgEl.textContent = "לא הצלחתי להעתיק אוטומטית — יש להעתיק ידנית"; msgEl.classList.add('show'); }
      return;
    }
  }
  if (msgEl) {
    msgEl.textContent = "✓ הועתק! אפשר להדביק בוואטסאפ";
    msgEl.classList.add('show');
    setTimeout(() => msgEl.classList.remove('show'), 2500);
  }
}

let currentUtterance = null;
function speakDay(day, btn) {
  if (!('speechSynthesis' in window)) {
    btn.textContent = "הקראה לא נתמכת בדפדפן זה";
    return;
  }
  if (window.speechSynthesis.speaking) {
    window.speechSynthesis.cancel();
    btn.classList.remove('speaking');
    btn.textContent = "🔊 הקרא לי בקול";
    return;
  }
  const text = day.items.map((it,i) => `${"אבגדהוזחטי"[i]||i+1}. ${it.text}`).join(" ... ");
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'he-IL';
  const voices = window.speechSynthesis.getVoices();
  const heVoice = voices.find(v => v.lang && v.lang.toLowerCase().startsWith('he'));
  if (heVoice) utter.voice = heVoice;
  utter.rate = 0.95;
  utter.onstart = () => { btn.classList.add('speaking'); btn.textContent = "⏹ עצור הקראה"; };
  utter.onend = () => { btn.classList.remove('speaking'); btn.textContent = "🔊 הקרא לי בקול"; };
  utter.onerror = () => { btn.classList.remove('speaking'); btn.textContent = "🔊 הקרא לי בקול"; };
  currentUtterance = utter;
  window.speechSynthesis.speak(utter);
}

function renderMain() {
  const mainArea = document.getElementById('mainArea');
  const t = todayStr();
  const day = DAYS.find(d => d.greg === t);

  if (!day) {
    const sorted = [...DAYS].sort((a,b) => a.greg.localeCompare(b.greg));
    const first = sorted[0];
    const last = sorted[sorted.length - 1];
    let note;
    if (t < first.greg) {
      note = `ההלכה הראשונה תופיע כאן אוטומטית ב-${first.gregLabel} (${first.heb}). אפשר לצפות מראש ברשימה למטה.`;
    } else if (t > last.greg) {
      note = `הגיעו לסוף הרשימה שהוכנה (${last.gregLabel}). אפשר להמשיך לשלוח לי הלכות נוספות ואוסיף אותן.`;
    } else {
      note = `אין הלכה מוכנה לתאריך הזה.`;
    }
    mainArea.innerHTML = `<div class="locked-note">${note}</div>`;
    return;
  }

  const html = document.createElement('div');
  html.className = 'today-card';

  const dateLine = document.createElement('div');
  dateLine.className = 'date-line';
  dateLine.innerHTML = `<span class="heb-date">${day.heb}</span><span class="greg-date">${day.gregLabel}</span>`;
  html.appendChild(dateLine);

  day.items.forEach((it, i) => {
    const letter = "אבגדהוזחטי"[i] || (i+1);
    const item = document.createElement('div');
    item.className = 'halacha-item';
    item.innerHTML = `<span class="letter">${letter}.</span><p>${it.text}</p><div class="source">${it.source}</div>`;
    html.appendChild(item);
  });

  const btnRow = document.createElement('div');
  btnRow.className = 'btn-row';
  const copyBtn = document.createElement('button');
  copyBtn.className = 'btn-copy';
  copyBtn.textContent = '📋 העתק לשליחה';
  const speakBtn = document.createElement('button');
  speakBtn.className = 'btn-speak';
  speakBtn.textContent = '🔊 הקרא לי בקול';
  btnRow.appendChild(copyBtn);
  btnRow.appendChild(speakBtn);
  html.appendChild(btnRow);

  const msg = document.createElement('div');
  msg.className = 'copied-msg';
  html.appendChild(msg);

  copyBtn.addEventListener('click', () => copyText(buildCopyText(day), msg));
  speakBtn.addEventListener('click', () => speakDay(day, speakBtn));

  mainArea.innerHTML = '';
  mainArea.appendChild(html);
}

function renderArchive() {
  const t = todayStr();
  const list = document.getElementById('archiveList');
  const sorted = [...DAYS].sort((a,b) => a.greg.localeCompare(b.greg));
  list.innerHTML = '';
  sorted.forEach(day => {
    const wrap = document.createElement('div');
    wrap.className = 'archive-day' + (day.greg === t ? ' today-marker' : '');
    const head = document.createElement('div');
    head.className = 'adate';
    const label = document.createElement('span');
    label.textContent = `${day.heb} · ${day.gregLabel}${day.greg === t ? ' (היום)' : ''}`;
    const btn = document.createElement('button');
    btn.className = 'mini-copy';
    btn.textContent = 'העתק';
    head.appendChild(label);
    head.appendChild(btn);
    wrap.appendChild(head);
    day.items.forEach((it,i) => {
      const letter = "אבגדהוזחטי"[i] || (i+1);
      const p = document.createElement('p');
      p.textContent = `${letter}. ${it.text}`;
      wrap.appendChild(p);
      const src = document.createElement('div');
      src.className = 'source';
      src.textContent = it.source;
      wrap.appendChild(src);
    });
    const miniMsg = document.createElement('div');
    miniMsg.className = 'copied-msg';
    wrap.appendChild(miniMsg);
    btn.addEventListener('click', () => copyText(buildCopyText(day), miniMsg));
    list.appendChild(wrap);
  });
}

if ('speechSynthesis' in window) {
  window.speechSynthesis.onvoiceschanged = () => {};
}

renderMain();
renderArchive();
</script>
